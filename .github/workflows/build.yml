name: Build & Test AlamHeadsAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [21]
        minecraft:
          - "1.20.6"
          - "1.21.1"
          - "1.21.4"
          - "1.21.8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build Plugin
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AlamHeadsAPI-${{ matrix.minecraft }}
          path: target/*.jar
